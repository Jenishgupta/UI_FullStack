<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Example</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

  <!-- Bootstrap JS -->
  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="p-4">
  <h2 class="mb-3">Dropdown</h2>

  <div class="dropend">
    <!-- Dropdown Button -->
    <button class="btn btn-dark dropdown-toggle" type="button"
            data-bs-toggle="dropdown" aria-expanded="false">
      <span class="bi bi-person-circle"></span> Login
    </button>

    <!-- Dropdown Menu -->
    <ul class="dropdown-menu dropdown-menu-dark">
      <li><a class="dropdown-item" href="#"><span class="bi bi-person"></span> Your Profile</a></li>
      <li><a class="dropdown-item" href="#"><span class="bi bi-heart"></span> Wish List</a></li>
      <li><a class="dropdown-item" href="#"><span class="bi bi-gift"></span> Offers</a></li>
      <li><a class="dropdown-item" href="../public/amazon-cards.html">
            <span class="bi bi-gift"></span> Amazon
          </a>
      </li>

      <li><hr class="dropdown-divider"></li>

      <li><a class="dropdown-item" href="#"><span class="bi bi-question-circle"></span> Help</a></li>
    </ul>
  </div>
</body>
</html>
