<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Breadcrumb</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

  <!-- Bootstrap JS -->
  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="container-fluid p-4 bg-light">
  <div class="container">
    <h2 class="mb-4 text-primary"><i class="bi bi-bag-check"></i> Flipkart</h2>

    <!-- Breadcrumb Navigation -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb bg-white p-3 rounded shadow-sm" style="--bs-breadcrumb-divider: ' > ';">
        <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-primary">Home</a></li>
        <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-primary">Electronics</a></li>
        <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-primary">Mobiles</a></li>
        <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-primary">Apple Mobiles</a></li>
        <li class="breadcrumb-item active text-dark" aria-current="page">iPhone</li>
      </ol>
    </nav>
  </div>
</body>
</html>
