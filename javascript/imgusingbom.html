<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    function bodyload() {
      // Set image source
      window.document.images[0].src = "../public/images/women-fashion.jpg";

      // Set Register button value
      window.document.forms[0].elements[2].value = "Register";

      // Set Login button value
      window.document.forms[1].elements[2].value = "Login";
    }
  </script>
</head>

<body onload="bodyload()">
  <div>
    <img width="100" height="100" border="1">
  </div>

  <div>
    <form>
      <h2>Register</h2>
      <dl>
        <dt>User Name</dt>
        <dd><input type="text"></dd>

        <dt>Age</dt>
        <dd><input type="number"></dd>
      </dl>
      <input type="button">
    </form>
  </div>

  <div>
    <form>
      <h2>User Login</h2>
      <dl>
        <dt>Email</dt>
        <dd><input type="email"></dd>

        <dt>Password</dt>
        <dd><input type="password"></dd>
      </dl>
      <input type="button">
    </form>
  </div>
</body>
</html>
