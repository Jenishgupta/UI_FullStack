<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function VerifyName() {
            var username = document.getElementById("txtName").value;
            var Namelabel = document.getElementById("lblName");

            if (username.length == 0) {
                Namelabel.innerHTML = "User Name Required".fontcolor('red').fontsize('2');
            } else {
                if (username.charCodeAt(0) >= 65 && username.charCodeAt(0) <= 90) {
                    Namelabel.innerHTML = "";
                } else {
                    Namelabel.innerHTML = "Name must start with uppercase letter".fontcolor('red').fontsize('2');
                }
            }
        }

        function VerifyComments() {
            var comments = document.getElementById("txtComments").value;
            var lblComments = document.getElementById("lblComments");
            lblComments.innerHTML = `${100 - comments.length} chars left`.fontcolor('gold');
        }
    </script>
</head>
<body>
    <dl>
        <dt>User Name</dt>
        <dd>
            <input type="text" onkeyup="VerifyName()" onblur="VerifyName()" id="txtName">
        </dd>
        <dd id="lblName"></dd>

        <dt>Your Comments</dt>
        <dd>
            <textarea maxlength="100" onkeyup="VerifyComments()" rows="4" cols="40" id="txtComments"></textarea>
        </dd>
        <dd id="lblComments"></dd>
    </dl>
</body>
</html>
