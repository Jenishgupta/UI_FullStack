<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <script>
    function DeleteClick() {
      let result = confirm("Delete Record\nAre you sure?");
      if (result === true) {
        alert("Deleted..");
      } else {
        alert("Canceled..");
      }
    }
  </script>
</head>

<body>
  <button onclick="DeleteClick()">Delete</button>
</body>
</html>
