<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <script>
        function bodyload() {
            const params = new URLSearchParams(location.search);
            document.getElementById("lblCategory").textContent = params.get("category") || "N/A";
            document.getElementById("lblProduct").textContent = params.get("product") || "N/A";
        }
    </script>
</head>
<body class="container-fluid" onload="bodyload()">
    <h3 class="mt-3 mb-4">Search Results</h3>

    <dl class="row">
        <dt class="col-sm-2">Category</dt>
        <dd class="col-sm-10" id="lblCategory"></dd>

        <dt class="col-sm-2">Product</dt>
        <dd class="col-sm-10" id="lblProduct"></dd>
    </dl>

    <a class="btn btn-warning mt-3" href="./search.html">
        <i class="bi bi-arrow-left-circle"></i> Back to Search
    </a>
</body>
</html>
